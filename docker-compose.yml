services:
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme123}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-changeme123} 'RETURN 1' || exit 1"]
      interval: 5s
      retries: 30
      start_period: 20s
  app:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme123}
      - LLM_API_KEY=${LLM_API_KEY:-}
    ports: ["8501:8501"]
    command: sh -c "python src/setup_data.py && python src/graph/load_graph.py && streamlit run src/dashboard/app.py --server.port=8501 --server.address=0.0.0.0"
volumes:
  neo4j_data: